targets:
  ___VARIABLE_productName:RFC1034Identifier___:
    type: application
    platform: iOS
    info:
      path: ../___VARIABLE_productName:RFC1034Identifier___/Resources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIBackgroundModes:
          - remote-notification
          - fetch
        ITSAppUsesNonExemptEncryption: false
        AppStoreId: ""
        TelegramChatId: ""
        Developer:
          Name: "___FULLUSERNAME___"
          WebsiteUrl: "romanov.cc"
          Email: "alexander@oversize.app"
          Facebook: "aromanov91"
          Telegram: "aromanov91"
        Company:
          Name: "Oversize"
          WebsiteUrl: "https://oversize.app"
          CdnUrl: "https://cdn.oversize.design"
          Email: "support@oversize.app"
          Facebook: "oversizedev"
          Telegram: "oversizeapp"
          Dribbble: "oversizedesign"
          Instagram: "oversize.design"
          Twitter: "oversizedesign"
          AppStoreId: "1459928735"
        FeatureFlags:
          Onboarding: true
          Apperance: true
          StoreKit: true
          CloudKit: true
          HealthKit: false
          FaceID: false
          Notifications: false
          Lookscreen: false
          Vibration: false
          Sounds: false
          BlurMinimize: false
    sources:
      - path: ../___VARIABLE_productName:RFC1034Identifier___
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER)
        TARGETED_DEVICE_FAMILY: "1,2"
        DEVELOPMENT_ASSET_PATHS: "\"___VARIABLE_productName:RFC1034Identifier___/Resources/Development\""
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES:
          - AppIcon1
          - AppIcon2
          - AppIcon3
          - AppIcon4
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen.storyboard
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSFaceIDUsageDescription: Auth in app
        # INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.medical
      configs:
        Debug:
          INFOPLIST_KEY_CFBundleDisplayName: ___VARIABLE_productName:RFC1034Identifier___ Dev
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon(Dev)
        AppStore:
          INFOPLIST_KEY_CFBundleDisplayName: ___VARIABLE_productName:RFC1034Identifier___
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

    dependencies:
      - package: NavigatorUI
      - package: OversizeUI
      - package: OversizeKit
      - package: OversizeNavigation
      - package: Env
      - package: Models
      - package: App
        products:
          - Main
          - Onboarding
          - Settings
      - sdk: StoreKit.framework
    entitlements:
      path: ../___VARIABLE_productName:RFC1034Identifier___/Resources/___VARIABLE_productName:RFC1034Identifier___.entitlements
      properties:
        aps-environment: development
        com.apple.developer.default-data-protection: NSFileProtectionComplete
        com.apple.security.app-sandbox: true
        com.apple.developer.icloud-container-identifiers: [iCloud.___VARIABLE_bundleIdentifierPrefix:bundleIdentifier___.___VARIABLE_productName:RFC1034Identifier___]
        com.apple.developer.icloud-services: [CloudKit]

  ___VARIABLE_productName:RFC1034Identifier___UITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ../___VARIABLE_productName:RFC1034Identifier___UITests
    dependencies:
      - target: ___VARIABLE_productName:RFC1034Identifier___
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_IDENTIFIER).UITests
        TEST_TARGET_NAME: ___VARIABLE_productName:RFC1034Identifier___
        TARGETED_DEVICE_FAMILY: "1,2"
