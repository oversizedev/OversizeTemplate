targets:
  ___VARIABLE_productName:RFC1034Identifier___:
    type: application
    platform: iOS
    deploymentTarget: 17.0
    info:
      path: ../___VARIABLE_productName:RFC1034Identifier___/Resources/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIBackgroundModes:
          - remote-notification
        ITSAppUsesNonExemptEncryption: false
        AppStoreId: ""
        TelegramChatId: ""
        Developer:
          Name: "Alexander Romanov"
          WebsiteUrl: "romanov.cc"
          Email: "alexander@oversize.app"
          Facebook: "aromanov91"
          Telegram: "aromanov91"
        Company:
          Name: "Oversize"
          WebsiteUrl: "https://oversize.app"
          CdnUrl: "https://cdn.oversize.design"
          Email: "support@oversize.app"
          Facebook: "oversizedev"
          Telegram: "oversizeapp"
          Dribbble: "oversizedesign"
          Instagram: "oversize.design"
          Twitter: "oversizedesign"
          AppStoreId: "1459928735"
        FeatureFlags:
          Onboarding: true
          Apperance: true
          StoreKit: true
          CloudKit: false
          HealthKit: false
          FaceID: false
          Notifications: false
          Lookscreen: false
          Vibration: false
          Sounds: false
          BlurMinimize: false
    sources:
      - path: ../Configs
      - path: ../___VARIABLE_productName:RFC1034Identifier___
    settings:
      base:
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen.storyboard
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSFaceIDUsageDescription: Auth in app
        # INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.medical
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: ___VARIABLE_bundleIdentifierPrefix:bundleIdentifier___.___VARIABLE_productName:RFC1034Identifier___.dev
          PRODUCT_NAME: ___VARIABLE_productName:RFC1034Identifier___ Dev
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon(Dev)
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        AppStore:
          PRODUCT_BUNDLE_IDENTIFIER: ___VARIABLE_bundleIdentifierPrefix:bundleIdentifier___.___VARIABLE_productName:RFC1034Identifier___
          PRODUCT_NAME: ___VARIABLE_productName:RFC1034Identifier___
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: APPSTORE

    dependencies:
      - package: NavigatorUI
      - package: FactoryKit
      - package: OversizeUI
      - package: OversizeServices
      - package: OversizeResources
      - package: OversizeLocalizable
      - package: OversizeKit
        products:
          - OversizeKit
          - OversizeNoticeKit
      - package: OversizeCore
      - package: OversizeComponents
      - package: Database
      - package: Env
      - package: App
        products:
          - Main
          - Onboarding
          - Settings
      - sdk: StoreKit.framework
    entitlements:
      path: ../___VARIABLE_productName:RFC1034Identifier___/Resources/___VARIABLE_productName:RFC1034Identifier___.entitlements
      properties:
        aps-environment: development
        com.apple.developer.default-data-protection: NSFileProtectionComplete
        com.apple.security.app-sandbox: true
        #com.apple.developer.icloud-container-identifiers: [iCloud.app.oversize.___VARIABLE_productName:RFC1034Identifier___]
        #com.apple.developer.icloud-services: [CloudKit]

